[project]
name = "agentic-patterns"
version = "0.1.0"
description = "The same agentic use cases, implemented three ways, side by side"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cyclopts>=4",
    "fastmcp>=4",
    "langchain>=1.4.0",
    "langchain-ollama>=1.1.0",
    "ollama>=0.6.2",
    "pydantic>=2.10",
    "pyyaml>=6.0.3",
    "rich>=14",
]

[project.scripts]
agentic-patterns = "agentic_patterns.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
