[project]
name = "agentic-patterns"
version = "0.1.0"
description = "The same agentic use cases, implemented three ways, side by side"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cyclopts>=5.4.2",
    "fastmcp>=4.1.8",
    "langchain>=1.5.0",
    "langchain-ollama>=1.1.0",
    "ollama>=0.6.3",
    "openevals>=0.2.5",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "rich>=14",
]

[project.scripts]
agentic-patterns = "agentic_patterns.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
