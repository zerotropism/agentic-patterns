[project]
name = "agentic-patterns"
version = "0.1.0"
description = "The same agentic use cases, implemented three ways, side by side"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cyclopts>=5.3.1",
    "fastmcp>=4.0.10",
    "langchain>=1.4.7",
    "langchain-ollama>=1.1.0",
    "ollama>=0.6.3",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "rich>=14",
]

[project.scripts]
agentic-patterns = "agentic_patterns.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
